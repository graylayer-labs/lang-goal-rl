name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # The org's shared CI (graylayer-labs/.github, ci-python.yml). Reports as
    # "checks / checks", the required check on main.
    permissions:
      contents: read
    uses: graylayer-labs/.github/.github/workflows/ci-python.yml@8c9fa19473d67349548fa516aa01fe4753e07003 # v1.0.0
    with:
      # MuJoCo needs a GL backend even for rgb_array rendering; with no X11 display on
      # the runner, use the OSMesa software renderer.
      system-packages: libosmesa6-dev libgl1 libglfw3
      env: MUJOCO_GL=osmesa
      pytest-args: tests/lang_goal_rl -q
      coverage-source: lang_goal_rl
      # ruff and ty are not in the dev group and format fails on main today; turned
      # on by #3.
      ruff: false
      format: false
      ty: false
